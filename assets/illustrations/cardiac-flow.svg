<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <defs>
    <linearGradient id="grad-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flow Lines -->
  <path d="M 90 120 C 160 120, 180 80, 240 80 S 320 160, 390 120 S 460 120, 510 120" stroke="url(#grad-pulse)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>
  
  <!-- Flow Nodes -->
  <!-- Node 1: Patient Data -->
  <g transform="translate(90, 120)">
    <circle r="36" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" filter="url(#glow)"/>
    <circle r="30" fill="rgba(14, 165, 233, 0.08)"/>
    <text y="-4" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PATIENT</text>
    <text y="10" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">180 Records</text>
  </g>

  <!-- Node 2: Clinical Features -->
  <g transform="translate(240, 80)">
    <circle r="36" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
    <circle r="30" fill="rgba(6, 182, 212, 0.08)"/>
    <text y="-4" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="700">FEATURES</text>
    <text y="10" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">13 Biomarkers</text>
  </g>

  <!-- Node 3: ML Engine -->
  <g transform="translate(390, 120)">
    <circle r="36" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)"/>
    <circle r="30" fill="rgba(139, 92, 246, 0.08)"/>
    <text y="-4" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ML ENGINE</text>
    <text y="10" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">7 Algorithms</text>
  </g>

  <!-- Node 4: Risk Intelligence -->
  <g transform="translate(510, 120)">
    <circle r="36" fill="#0f172a" stroke="#f43f5e" stroke-width="2" filter="url(#glow)"/>
    <circle r="30" fill="rgba(244, 63, 94, 0.1)"/>
    <text y="-4" text-anchor="middle" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="700">RISK</text>
    <text y="10" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Stratified</text>
  </g>
</svg>
